<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNAPKEY | Admin Dashboard</title>
    
    <script src="admin-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'CameraPlainVariable';
            src: url('https://cdn.gpteng.co/mcp-widgets/v1/fonts/CameraPlainVariable.woff2') format('woff2');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }
        :root { --primary: #6366f1; --dark: #0f172a; --bg: #f1f5f9; --success: #10b981; --danger: #ef4444; --gray: #64748b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--dark); }
        h1, h2, h3 { font-family: 'CameraPlainVariable', sans-serif; }
        
        #loginOverlay { position: fixed; inset: 0; background: var(--dark); display: flex; align-items: center; justify-content: center; z-index: 5000; }
        .login-card { background: white; padding: 3.5rem; border-radius: 40px; width: 450px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.3); }
        .login-card h2 { font-size: 2.5rem; margin-bottom: 1.5rem; letter-spacing: -2px; }
        input[type="password"] { width: 100%; padding: 1.2rem; margin-bottom: 1.5rem; border-radius: 20px; border: 2px solid #e2e8f0; font-size: 1.1rem; text-align: center; font-weight: 600; }
        .btn-unlock { width: 100%; padding: 1.2rem; background: var(--primary); color: white; border: none; border-radius: 20px; font-weight: 800; font-size: 1.1rem; cursor: pointer; transition: 0.3s; }
        .btn-unlock:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3); }
        
        .main-container { display: none; padding: 40px; max-width: 1500px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .header h1 { font-size: 3rem; letter-spacing: -2px; }
        
        .filter-bar { background: white; padding: 1.5rem; border-radius: 25px; margin-bottom: 30px; display: flex; gap: 15px; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .search-input { flex: 1; padding: 0.8rem 1.2rem; border-radius: 15px; border: 1px solid #e2e8f0; font-weight: 600; outline: none; }
        .filter-select { padding: 0.8rem 1.2rem; border-radius: 15px; border: 1px solid #e2e8f0; font-weight: 700; color: var(--dark); cursor: pointer; outline: none; }
        
        .stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 1.5rem 2rem; border-radius: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .stat-card h4 { color: var(--gray); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .stat-card div { font-size: 1.6rem; font-weight: 800; color: var(--primary); }
        
        .actions { display: flex; gap: 12px; }
        .btn-action { padding: 0.8rem 1.2rem; border-radius: 15px; font-weight: 700; cursor: pointer; transition: 0.2s; border: 1px solid transparent; display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
        .btn-promo { background: var(--dark); color: white; }
        .btn-excel { background: #059669; color: white; }
        .btn-cleanup { background: #f59e0b; color: white; }
        .btn-lock { background: white; border-color: #ddd; color: var(--dark); }
        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        .table-wrapper { background: white; border-radius: 35px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); overflow: hidden; border: 1px solid rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; min-width: 1200px; }
        th { background: #f8fafc; padding: 25px 20px; text-align: left; font-size: 0.75rem; color: var(--gray); text-transform: uppercase; letter-spacing: 1.5px; border-bottom: 2px solid #f1f5f9; }
        td { padding: 20px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        
        tr.completed-row { opacity: 0.6; background: #f8fafc; }
        .checkbox-custom { width: 24px; height: 24px; cursor: pointer; accent-color: var(--success); }
        
        .assets-list { display: flex; flex-direction: column; gap: 6px; min-width: 220px; }
        .asset-item { display: flex; align-items: center; justify-content: space-between; background: var(--bg); padding: 6px 10px; border-radius: 10px; border: 1px solid #e2e8f0; }
        .asset-label { font-size: 0.65rem; font-weight: 800; color: var(--gray); }
        .asset-links { display: flex; gap: 4px; }
        .btn-dl { padding: 3px 8px; background: white; border: 1px solid #ddd; border-radius: 6px; color: var(--primary); font-size: 0.65rem; font-weight: 700; text-decoration: none; }
        .btn-dl:hover { background: var(--primary); color: white; }
        
        .promo-tag { background: #fee2e2; color: #dc2626; padding: 4px 10px; border-radius: 8px; font-weight: 700; font-size: 0.75rem; display: inline-block; }
        .btn-delete { padding: 8px 12px; background: #fef2f2; color: var(--danger); border: none; border-radius: 10px; cursor: pointer; font-weight: 700; }
        
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 6000; }
        .modal-overlay.active { display: flex; }
        .modal-card { background: white; padding: 2rem; border-radius: 20px; width: 400px; display: flex; flex-direction: column; gap: 15px; }
        .modal-card input, .modal-card select { padding: 12px; border-radius: 10px; border: 1px solid #ccc; font-weight: 600; }
        .btn-save { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-cancel { background: #eee; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        
        @media (max-width: 1200px) { .stats-bar { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-card">
            <h2>Admin Login</h2>
            <input type="password" id="adminPass" placeholder="Enter Secure Password">
            <button class="btn-unlock" onclick="handleLogin()">Unlock Dashboard</button>
        </div>
    </div>

    <div class="main-container" id="adminUI">
        <div class="header">
            <h1>SNAPKEY Dashboard</h1>
            <div class="actions">
                <button class="btn-action btn-cleanup" onclick="cleanupOldPhotos()" title="Delete photos for orders completed > 3 days ago">Auto-Cleanup Storage</button>
                <button class="btn-action btn-excel" onclick="exportToExcel()">Download Spreadsheet</button>
                <button class="btn-action btn-promo" onclick="openPromoModal()">+ Add Promo</button>
                <button class="btn-action btn-lock" onclick="location.reload()">Lock</button>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-card"><h4>Total Orders</h4><div id="statTotal">0</div></div>
            <div class="stat-card"><h4>Pending</h4><div id="statPending">0</div></div>
            <div class="stat-card"><h4>Money Received</h4><div id="statEarnings" style="color: var(--success)">0.00 AED</div></div>
            <div class="stat-card"><h4>Projected Total</h4><div id="statProjected" style="color: var(--primary)">0.00 AED</div></div>
        </div>

        <div class="filter-bar">
            <input type="text" id="searchInput" placeholder="Search by name, email or phone..." class="search-input" oninput="filterOrders()">
            <select id="statusFilter" class="filter-select" onchange="filterOrders()">
                <option value="all">All Orders</option>
                <option value="pending">Pending Only</option>
                <option value="completed">Completed Only</option>
            </select>
        </div>

        <div class="table-wrapper">
            <table>
                <thead><tr><th>Done</th><th>ID</th><th>Customer</th><th>Promo</th><th>Price</th><th>Keychain Photos</th><th>Date</th><th>Action</th></tr></thead>
                <tbody id="orderTable"></tbody>
            </table>
        </div>
    </div>

    <div class="modal-overlay" id="promoModal">
        <div class="modal-card">
            <h2>New Promo Code</h2>
            <input type="text" id="promoCode" placeholder="PROMOCODE" style="text-transform: uppercase;">
            <select id="promoType"><option value="percent">Percentage (%)</option><option value="fixed">Fixed (AED)</option></select>
            <input type="number" id="promoValue" placeholder="Value">
            <button class="btn-save" onclick="createPromo()">Create Promo</button>
            <button class="btn-cancel" onclick="closePromoModal()">Cancel</button>
        </div>
    </div>

    <script>
        const sb = supabase.createClient(CONFIG.SB_URL, CONFIG.SB_KEY);
        let allOrders = [];

        function simpleHash(str) {
            let h = 0; for (let i = 0; i < str.length; i++) { h = (h << 5) - h + str.charCodeAt(i); h |= 0; }
            return h.toString();
        }

        function handleLogin() {
            const typed = document.getElementById('adminPass').value;
            if (simpleHash(typed) === CONFIG.ADMIN_PASSWORD_HASH) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminUI').style.display = 'block';
                loadOrders();
            } else { alert("Incorrect password."); }
        }

        async function loadOrders() {
            const { data, error } = await sb.from('orders').select('*').order('created_at', { ascending: false });
            if (error) { alert("Supabase Error: " + error.message); return; }
            allOrders = data;
            renderOrders(allOrders);
            updateStats(allOrders);
        }

        function updateStats(orders) {
            let pending = 0, received = 0, projected = 0;
            orders.forEach(o => {
                const price = parseFloat(o.total_price_aed || 0);
                projected += price;
                
                // Fix: Check text status
                if ((o.status || '').toLowerCase() === 'completed') {
                    received += price;
                } else {
                    pending++;
                }
            });
            document.getElementById('statTotal').innerText = orders.length;
            document.getElementById('statPending').innerText = pending;
            document.getElementById('statEarnings').innerText = received.toFixed(2) + " AED";
            document.getElementById('statProjected').innerText = projected.toFixed(2) + " AED";
        }

        function filterOrders() {
            const s = document.getElementById('searchInput').value.toLowerCase();
            const f = document.getElementById('statusFilter').value;
            const filtered = allOrders.filter(o => {
                const search = (o.customer_name && o.customer_name.toLowerCase().includes(s)) || 
                               (o.customer_email && o.customer_email.toLowerCase().includes(s)) || 
                               (o.phone && o.phone.includes(s));
                
                // Fix: Check text status
                const currentStatus = (o.status || 'pending').toLowerCase();
                const statusMatches = f === 'all' || f === currentStatus;
                
                return search && statusMatches;
            });
            renderOrders(filtered);
        }

        function renderOrders(orders) {
            const table = document.getElementById('orderTable');
            table.innerHTML = "";
            orders.forEach(o => {
                let assetsHtml = '<div class="assets-list">';
                
                if (o.items && o.items.length > 0) {
                    o.items.forEach(item => {
                        if (item.front_name === "[DELETED]") {
                            assetsHtml += `<div class="asset-item"><span class="asset-label">Item #${item.keychain_no}: Photos Deleted</span></div>`;
                        } else {
                            const fExt = item.front_name.split('.').pop();
                            const bExt = item.back_name.split('.').pop();
                            const actualFrontName = `${o.id}_front_${item.keychain_no}.${fExt}`;
                            const actualBackName = `${o.id}_back_${item.keychain_no}.${bExt}`;

                            const fUrl = sb.storage.from('order-photos').getPublicUrl(actualFrontName).data.publicUrl;
                            const bUrl = sb.storage.from('order-photos').getPublicUrl(actualBackName).data.publicUrl;
                            
                            assetsHtml += `
                                <div class="asset-item">
                                    <span class="asset-label">Item #${item.keychain_no}</span>
                                    <div class="asset-links">
                                        <a href="${fUrl}" target="_blank" class="btn-dl">Front</a>
                                        <a href="${bUrl}" target="_blank" class="btn-dl">Back</a>
                                    </div>
                                </div>`;
                        }
                    });
                } 
                else if (o.front_photo_path || o.back_photo_path) {
                    const fUrl = o.front_photo_path ? sb.storage.from('order-photos').getPublicUrl(o.front_photo_path).data.publicUrl : '#';
                    const bUrl = o.back_photo_path ? sb.storage.from('order-photos').getPublicUrl(o.back_photo_path).data.publicUrl : '#';
                    assetsHtml += `
                        <div class="asset-item">
                            <span class="asset-label">Legacy Order</span>
                            <div class="asset-links">
                                ${o.front_photo_path ? `<a href="${fUrl}" target="_blank" class="btn-dl">Front</a>` : ''}
                                ${o.back_photo_path ? `<a href="${bUrl}" target="_blank" class="btn-dl">Back</a>` : ''}
                            </div>
                        </div>`;
                } else { 
                    assetsHtml += '<span style="color:#ccc; font-size: 0.75rem; font-weight: bold;">No Photos Attached</span>'; 
                }
                
                assetsHtml += '</div>';

                // Fix: Check text status for row rendering
                const isCompleted = (o.status || '').toLowerCase() === 'completed';

                table.innerHTML += `<tr class="${isCompleted ? 'completed-row' : ''}">
                    <td><input type="checkbox" class="checkbox-custom" ${isCompleted ? 'checked' : ''} onchange="toggleStatus(${o.id}, this.checked)"></td>
                    <td style="font-family: monospace; font-weight: 700; color: var(--gray)">#${o.id}</td>
                    <td><div style="font-weight: 800">${o.customer_name}</div><div style="font-size: 0.75rem; color: var(--primary); font-weight: 600">${o.customer_email}</div><div style="font-size: 0.7rem; color: var(--gray)">${o.phone || 'No phone'}</div></td>
                    <td>${o.promo_code && o.promo_code !== 'EMPTY' ? `<span class="promo-tag">${o.promo_code}</span>` : '—'}</td>
                    <td style="font-weight: 900; color: var(--primary)">${parseFloat(o.total_price_aed || 0).toFixed(2)}</td>
                    <td>${assetsHtml}</td>
                    <td style="font-size: 0.75rem; color: var(--gray)">${new Date(o.created_at).toLocaleDateString()}</td>
                    <td><button class="btn-delete" onclick="deleteOrder(${o.id})">Delete</button></td>
                </tr>`;
            });
        }

        // Fix: Update string status instead of boolean
        async function toggleStatus(id, isChecked) {
            const newStatus = isChecked ? "Completed" : "Pending";
            const { error } = await sb.from('orders').update({ status: newStatus }).eq('id', id);
            if (error) {
                alert("Failed to update status: " + error.message);
            } else {
                loadOrders();
            }
        }

        async function deleteOrder(id) {
            if (!confirm("Delete order #" + id + " and all photos?")) return;
            const { data: order } = await sb.from('orders').select('*').eq('id', id).single();
            
            const filesToDelete = [];
            
            if(order && order.items) {
                order.items.forEach(k => { 
                    if(k.front_name !== "[DELETED]"){ 
                        const fExt = k.front_name.split('.').pop();
                        const bExt = k.back_name.split('.').pop();
                        filesToDelete.push(`${id}_front_${k.keychain_no}.${fExt}`); 
                        filesToDelete.push(`${id}_back_${k.keychain_no}.${bExt}`); 
                    } 
                });
            }
            if (order && order.front_photo_path) filesToDelete.push(order.front_photo_path);
            if (order && order.back_photo_path) filesToDelete.push(order.back_photo_path);
            
            if(filesToDelete.length > 0) {
                await sb.storage.from('order-photos').remove(filesToDelete);
            }
            
            await sb.from('orders').delete().eq('id', id);
            loadOrders();
        }

        async function cleanupOldPhotos() {
            const threeDaysAgo = new Date();
            threeDaysAgo.setDate(threeDaysAgo.getDate() - 3);
            
            const toCleanup = allOrders.filter(o => {
                // Fix: Check text status
                const isOld = (o.status || '').toLowerCase() === 'completed' && new Date(o.created_at) < threeDaysAgo;
                const hasNewPhotos = o.items && o.items.some(k => k.front_name !== "[DELETED]");
                const hasOldPhotos = o.front_photo_path || o.back_photo_path;
                return isOld && (hasNewPhotos || hasOldPhotos);
            });
            
            if(toCleanup.length === 0) return alert("No photos need cleaning (Completed for 3+ days).");
            if(!confirm(`Clean up photos for ${toCleanup.length} old orders? This saves space.`)) return;

            for(const o of toCleanup) {
                const filesToDelete = [];
                let updateData = {};

                if (o.items) {
                    const updatedItems = o.items.map(k => {
                        if(k.front_name !== "[DELETED]") { 
                            const fExt = k.front_name.split('.').pop();
                            const bExt = k.back_name.split('.').pop();
                            filesToDelete.push(`${o.id}_front_${k.keychain_no}.${fExt}`); 
                            filesToDelete.push(`${o.id}_back_${k.keychain_no}.${bExt}`); 
                        }
                        return { ...k, front_name: "[DELETED]", back_name: "[DELETED]" };
                    });
                    updateData.items = updatedItems;
                }

                if (o.front_photo_path) {
                    filesToDelete.push(o.front_photo_path);
                    updateData.front_photo_path = null;
                }
                if (o.back_photo_path) {
                    filesToDelete.push(o.back_photo_path);
                    updateData.back_photo_path = null;
                }

                if(filesToDelete.length > 0) await sb.storage.from('order-photos').remove(filesToDelete);
                if(Object.keys(updateData).length > 0) await sb.from('orders').update(updateData).eq('id', o.id);
            }
            
            alert("Storage Cleaned!");
            loadOrders();
        }

        function exportToExcel() {
            const data = allOrders.map(o => {
                let photoLinks = "";
                let qty = 0;
                
                if(o.items && o.items.length > 0) {
                    qty = o.items.length;
                    photoLinks = o.items.map(k => {
                        if(k.front_name === "[DELETED]") return `Item#${k.keychain_no}: DELETED`;
                        
                        const fExt = k.front_name.split('.').pop();
                        const bExt = k.back_name.split('.').pop();
                        const actualFront = `${o.id}_front_${k.keychain_no}.${fExt}`;
                        const actualBack  = `${o.id}_back_${k.keychain_no}.${bExt}`;

                        const f = sb.storage.from('order-photos').getPublicUrl(actualFront).data.publicUrl;
                        const b = sb.storage.from('order-photos').getPublicUrl(actualBack).data.publicUrl;
                        return `Item#${k.keychain_no}: Front(${f}) Back(${b})`;
                    }).join(" | ");
                } else if (o.front_photo_path || o.back_photo_path) {
                    qty = 1; 
                    const f = o.front_photo_path ? sb.storage.from('order-photos').getPublicUrl(o.front_photo_path).data.publicUrl : 'None';
                    const b = o.back_photo_path ? sb.storage.from('order-photos').getPublicUrl(o.back_photo_path).data.publicUrl : 'None';
                    photoLinks = `Legacy Front: ${f} | Legacy Back: ${b}`;
                } else {
                    photoLinks = "No Photos Attached";
                }

                return { 
                    OrderID: o.id, 
                    Customer: o.customer_name, 
                    Email: o.customer_email, 
                    Phone: o.phone || "N/A", 
                    Qty: qty, 
                    Total: o.total_price_aed, 
                    Promo: o.promo_code || "None", 
                    // Fix: Check text status for Excel export
                    Status: (o.status || '').toLowerCase() === 'completed' ? "Completed" : "Pending", 
                    Date: new Date(o.created_at).toLocaleString(), 
                    PhotoLinks: photoLinks 
                };
            });
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Orders");
            XLSX.writeFile(wb, `SNAPKEY_Orders_${new Date().toISOString().split('T')[0]}.xlsx`);
        }

        function openPromoModal() { document.getElementById('promoModal').classList.add('active'); }
        function closePromoModal() { document.getElementById('promoModal').classList.remove('active'); }
        async function createPromo() {
            const code = document.getElementById('promoCode').value.trim().toUpperCase();
            const type = document.getElementById('promoType').value;
            const value = parseFloat(document.getElementById('promoValue').value);
            if(!code || !value) return alert("Fill all fields.");
            const { error } = await sb.from('promo_codes').insert([{ code, discount_type: type, discount_value: value, active: true }]);
            if(error) alert(error.message); else { alert("Promo created!"); closePromoModal(); loadOrders(); }
        }
        document.getElementById('adminPass').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });
    </script>
</body>
</html>
