<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Snapkey | Customize</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{ --bg:#f6f3f8; --card:#ffffff; --text:#0a0730; --muted:#7d7794; --border:#e5d7ef; --purple:#8f44fd; --purple2:#d94ecf; --navy:#040b3f; }
*{ margin:0; padding:0; box-sizing:border-box; }
body{ background:var(--bg); font-family:'Inter',sans-serif; color:var(--text); min-height:100vh; }
.container{ width:100%; max-width:980px; margin:auto; padding:28px; }
.topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:30px; }
.back-btn{ display:flex; align-items:center; gap:8px; color:#5d5672; text-decoration:none; font-size:14px; font-weight:500; }
.logo-wrap{ display:flex; align-items:center; gap:10px; }
.logo-wrap img{ width:38px; height:38px; border-radius:50%; object-fit:cover; }
.logo-wrap span{ color:#7d27e7; font-weight:600; font-size:28px; font-family:'Cormorant Garamond',serif; }
.card{ width:100%; background:white; border:1px solid var(--border); border-radius:28px; padding:45px; box-shadow:0 10px 40px rgba(125,0,255,0.05); }
.title{ text-align:center; font-size:72px; font-family:'Cormorant Garamond',serif; font-weight:700; margin-bottom:40px; color:#070539; }
.label{ font-size:15px; font-weight:700; margin-bottom:10px; display:block; }
.input{ width:100%; height:64px; border:1px solid #e3d4ec; border-radius:18px; background:#f7f3f8; padding:0 20px; outline:none; font-size:15px; }
.input:focus{ border-color:#b76cff; background:white; }
.row{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.qty-box{ margin-top:28px; background:#f5eff7; border-radius:22px; padding:22px; display:flex; align-items:center; justify-content:center; gap:35px; }
.qty-btn{ width:52px; height:52px; border-radius:16px; border:none; background:white; cursor:pointer; font-size:22px; font-weight:700; color:#2e2752; box-shadow:0 4px 15px rgba(0,0,0,0.05); }
.qty-text{ font-size:28px; font-weight:800; min-width:25px; text-align:center; }
.keychain-section{ margin-top:28px; padding:25px; border:1px solid #eadcf2; border-radius:24px; background:#fcfbfd; }
.key-title{ font-size:18px; font-weight:800; margin-bottom:20px; }
.upload-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.upload-box{ aspect-ratio:1/1; border:2px dashed #d7aef7; border-radius:24px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; background:#faf7fc; overflow:hidden; position:relative; transition:0.3s; }
.upload-box:hover{ border-color:#a93fff; background:#f7efff; }
.upload-box img{ width:100%; height:100%; object-fit:cover; display:none; position:absolute; }
.upload-box span{ z-index:2; text-align: center; }
.upload-title{ font-weight:800; margin-top:12px; }
.upload-sub{ font-size:13px; color:#77718d; margin-top:6px; }
.promo-wrap{ margin-top:30px; }
.promo-row{ display:flex; gap:14px; }
.apply-btn{ border:none; min-width:110px; border-radius:16px; color:white; font-weight:700; cursor:pointer; background:linear-gradient(135deg,var(--purple),var(--purple2)); }
.price-box{ margin-top:28px; background:#f5eff7; border-radius:22px; padding:30px; text-align:center; }
.price-small{ font-size:12px; letter-spacing:5px; font-weight:800; color:#716b84; margin-bottom:8px; }
.price{ font-size:52px; font-family:'Cormorant Garamond',serif; font-weight:700; background:linear-gradient(135deg,#8f44fd,#d94ecf); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.submit-btn{ width:100%; height:72px; border:none; border-radius:22px; background:#03093f; color:white; font-size:18px; font-weight:800; margin-top:30px; cursor:pointer; transition:0.25s; }
.submit-btn:hover{ transform:translateY(-2px); }
.submit-btn:disabled{ background:#756f89; cursor:not-allowed; transform:none; }
.bottom-text{ margin-top:16px; text-align:center; color:#756f89; font-size:13px; }
.modal{ position:fixed; inset:0; background:rgba(0,0,0,0.7); display:none; align-items:center; justify-content:center; z-index:9999; padding:20px; }
.modal.active{ display:flex; }
.receipt{ width:100%; max-width:600px; background:white; border-radius:30px; padding:40px; }
.receipt h2{ text-align:center; font-size:42px; margin-bottom:25px; font-family:'Cormorant Garamond',serif; }
.receipt-box{ background:#f7f3fa; border-radius:20px; padding:25px; margin-top:20px; }
.receipt-box p{ margin-bottom:12px; font-size:15px; }
.download-btn{ width:100%; margin-top:25px; height:60px; border:none; border-radius:18px; background:linear-gradient(135deg,var(--purple),var(--purple2)); color:white; font-weight:800; cursor:pointer; font-size:16px; }
.close-btn{ width:100%; margin-top:12px; height:58px; border:1px solid #ddd; border-radius:18px; background:white; cursor:pointer; font-weight:700; }
@media(max-width:850px){ .title{ font-size:52px; } .row, .upload-grid{ grid-template-columns:1fr; } .card{ padding:25px; } }
</style>
</head>
<body>

<div class="container">
    <div class="topbar">
        <a href="index.html" class="back-btn">← Back</a>
        <div class="logo-wrap">
            <span>Snapkey</span>
        </div>
    </div>

    <div class="card">
        <h1 class="title">Customize</h1>
        <form id="orderForm">
            <label class="label">Full Name</label>
            <input required type="text" class="input" id="custName" placeholder="Your Name">

            <div class="row" style="margin-top:22px;">
                <div>
                    <label class="label">Email Address</label>
                    <input required type="email" class="input" id="custEmail" placeholder="email@example.com">
                </div>
                <div>
                    <label class="label">Phone Number</label>
                    <input type="text" class="input" id="custPhone" placeholder="05X XXX XXXX">
                </div>
            </div>

            <div class="qty-box">
                <button type="button" class="qty-btn" onclick="changeQty(-1)">−</button>
                <div class="qty-text" id="qtyText">1</div>
                <button type="button" class="qty-btn" onclick="changeQty(1)">+</button>
            </div>

            <div id="keychainContainer"></div>

            <div class="promo-wrap">
                <label class="label">Promo Code</label>
                <div class="promo-row">
                    <input type="text" class="input" id="promoInput" placeholder="ENTER CODE (E.G. SCHOOL)" style="text-transform:uppercase;">
                    <button type="button" class="apply-btn" id="promoBtn">Apply</button>
                </div>
            </div>

            <div class="price-box">
                <div class="price-small">FINAL PRICE</div>
                <div class="price" id="totalDisplay">4.00 AED</div>
            </div>

            <button class="submit-btn" id="submitBtn">Place Your Order</button>
            <div class="bottom-text">Collect at Stall 5 · Market Day June 16–18, 2026</div>
        </form>
    </div>
</div>

<div class="modal" id="receiptModal">
    <div class="receipt" id="receiptContent">
        <h2>Order Success!</h2>
        <div class="receipt-box">
            <p><strong>Order ID:</strong> <span id="rID"></span></p>
            <p><strong>Name:</strong> <span id="rName"></span></p>
            <p><strong>Email:</strong> <span id="rEmail"></span></p>
            <p><strong>Quantity:</strong> <span id="rQty"></span></p>
            <p><strong>Total:</strong> <span id="rTotal"></span></p>
        </div>
        <button class="download-btn" onclick="downloadReceipt()">Download Receipt PDF</button>
        <button class="close-btn" onclick="location.reload()">Back To Home</button>
    </div>
</div>

<script>
const config = {
    url: "https://pkzvftleoysldqmjdgds.supabase.co",
    key: "sb_publishable_H9QIgdBqQZtHXcywZyDsjA_s4fXffjN",
    ejs_key: "wFE7Ll5cDKSxM4Zfs",
    ejs_svc: "service_zlh57wd",
    ejs_tmp: "template_hu5h00o"
};

let sb;
window.onload = () => {
    emailjs.init(config.ejs_key);
    sb = window.supabase.createClient(config.url, config.key);
    renderKeychains();
};

let qty = 1;
let activePromo = null;
let discountInfo = { type:null, value:0 };

function changeQty(n){
    qty += n;
    if(qty < 1) qty = 1;
    if(qty > 10) qty = 10;
    document.getElementById('qtyText').innerText = qty;
    renderKeychains();
    updateTotal();
}

function renderKeychains(){
    const container = document.getElementById('keychainContainer');
    container.innerHTML = "";
    for(let i=1; i<=qty; i++){
        container.innerHTML += `
        <div class="keychain-section">
            <div class="key-title">Keychain ${i}</div>
            <div class="upload-grid">
                <label class="upload-box">
                    <input type="file" accept="image/*" hidden required id="front${i}" onchange="previewImage(this,'frontImg${i}','frontText${i}')">
                    <img id="frontImg${i}">
                    <span id="frontText${i}">
                        <div style="font-size:34px;">⬆</div>
                        <div class="upload-title">Front Photo</div>
                        <div class="upload-sub">Tap to upload</div>
                    </span>
                </label>
                <label class="upload-box">
                    <input type="file" accept="image/*" hidden required id="back${i}" onchange="previewImage(this,'backImg${i}','backText${i}')">
                    <img id="backImg${i}">
                    <span id="backText${i}">
                        <div style="font-size:34px;">⬆</div>
                        <div class="upload-title">Back Photo</div>
                        <div class="upload-sub">Tap to upload</div>
                    </span>
                </label>
            </div>
        </div>`;
    }
}

function previewImage(input,imgId,textId){
    const file = input.files[0];
    if(!file) return;
    const img = document.getElementById(imgId);
    img.src = URL.createObjectURL(file);
    img.style.display = "block";
    document.getElementById(textId).style.display = "none";
}

document.getElementById('promoBtn').onclick = async () => {
    const code = document.getElementById('promoInput').value.trim().toUpperCase();
    const email = document.getElementById('custEmail').value.trim().toLowerCase();
    if(!code){ alert("Enter promo code"); return; }
    if(!email){ alert("Enter email first"); return; }

    const { data: promo, error } = await sb.from('promo_codes').select('*').eq('code', code).eq('active', true).single();
    if(error || !promo){ alert("Invalid promo code"); return; }

    const { data: usage } = await sb.from('used_promos').select('*').eq('email', email).eq('promo_code', code).maybeSingle();
    if(usage){ alert("You already used this code"); return; }

    activePromo = promo.code;
    discountInfo = { type: promo.discount_type, value: parseFloat(promo.discount_value) };
    updateTotal();
    
    const btn = document.getElementById('promoBtn');
    btn.innerText = "Applied";
    btn.style.opacity = "0.7";
};

function updateTotal(){
    let subtotal = qty * 4;
    let discount = 0;
    if(activePromo){
        if(discountInfo.type === "percent") discount = subtotal * (discountInfo.value / 100);
        else discount = discountInfo.value;
    }
    const final = Math.max(0, subtotal - discount);
    window.finalTotal = final;
    document.getElementById('totalDisplay').innerText = final.toFixed(2) + " AED";
}
updateTotal();

// HELPER: Sanitizes filenames so Supabase doesn't reject weird characters
function sanitizeFilename(name) {
    return name.replace(/[^a-z0-9.]/gi, '_').toLowerCase();
}

document.getElementById('orderForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = "Processing...";

    try {
        const name = document.getElementById('custName').value;
        const email = document.getElementById('custEmail').value;
        const phone = document.getElementById('custPhone').value;
        const items = [];

        for(let i=1; i<=qty; i++){
            const frontFile = document.getElementById(`front${i}`).files[0];
            const backFile = document.getElementById(`back${i}`).files[0];
            if(!frontFile || !backFile) throw new Error(`Missing photos for keychain ${i}`);
            items.push({ keychain_no: i, front_name: frontFile.name, back_name: backFile.name });
        }

        // 1. Create main order record
        const { data: order, error } = await sb.from('orders').insert([{
            customer_name: name,
            customer_email: email,
            phone: phone,
            promo_code: activePromo,
            total_price_aed: window.finalTotal,
            items: items // Assuming this is a jsonb column
        }]).select().single();

        if(error) throw error;

        // Array to hold all the rows we want to insert into order_photos
        const photoInserts = [];

        // 2. Upload images loop
        for(let i=1; i<=qty; i++){
            const frontFile = document.getElementById(`front${i}`).files[0];
            const backFile = document.getElementById(`back${i}`).files[0];

            const frontExt = frontFile.name.split('.').pop() || 'jpg';
            const backExt = backFile.name.split('.').pop() || 'jpg';

            // Sanitize filenames with order ID to ensure uniqueness
            const frontName = sanitizeFilename(`${order.id}_front_${i}.${frontExt}`);
            const backName = sanitizeFilename(`${order.id}_back_${i}.${backExt}`);

            // Upload Front
            const { error: frontErr } = await sb.storage.from('order-photos').upload(frontName, frontFile, { upsert: true });
            if(frontErr) throw frontErr;

            // Upload Back
            const { error: backErr } = await sb.storage.from('order-photos').upload(backName, backFile, { upsert: true });
            if(backErr) throw backErr;

            // Get Public URLs
            const frontUrl = sb.storage.from('order-photos').getPublicUrl(frontName).data.publicUrl;
            const backUrl = sb.storage.from('order-photos').getPublicUrl(backName).data.publicUrl;

            // Add to array for batch insertion
            photoInserts.push({
                order_id: order.id,
                keychain_no: i,
                front_url: frontUrl,
                back_url: backUrl
            });
        }

        // 3. Batch insert all photos into order_photos table
        const { error: photoDbErr } = await sb.from('order_photos').insert(photoInserts);
        if(photoDbErr) throw photoDbErr;

        // 4. Save Promo Usage
        if(activePromo){
            await sb.from('used_promos').insert([{ email: email, promo_code: activePromo }]);
        }

        // 5. Send Email
        try {
            await emailjs.send(config.ejs_svc, config.ejs_tmp, {
                cust_name: name, cust_email: email, order_id: order.id, quantity: qty,
                total_price: window.finalTotal.toFixed(2), to_name: name
            });
        } catch (emailErr) {
            console.warn("Email failed to send, but order was placed.", emailErr);
        }

        // Display Success Modal
        document.getElementById('rID').innerText = "#" + order.id;
        document.getElementById('rName').innerText = name;
        document.getElementById('rEmail').innerText = email;
        document.getElementById('rQty').innerText = qty;
        document.getElementById('rTotal').innerText = window.finalTotal.toFixed(2) + " AED";
        document.getElementById('receiptModal').classList.add('active');
        btn.innerText = "Success";

    } catch(err) {
        console.error("Order process error: ", err);
        alert("Order failed:\n\n" + err.message);
        btn.disabled = false;
        btn.innerText = "Place Your Order";
    }
};

function downloadReceipt(){
    const receipt = document.getElementById('receiptContent');
    html2canvas(receipt).then(canvas=>{
        const img = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF();
        pdf.addImage(img, 'PNG', 10, 10, 190, 0);
        pdf.save('Snapkey_Receipt.pdf');
    });
}
</script>
</body>
</html>
